spring.application.name=door-management-back

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/door_management
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=8080

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# API Information
springdoc.info.title=Door Management System API
springdoc.info.version=1.0.0
springdoc.info.description=RESTful API for managing doors, users, and access control within a company. This API allows administrators to create and manage doors, users, and assign access permissions between them.

# Server Configuration for OpenAPI
springdoc.servers[0].url=http://localhost:8080
springdoc.servers[0].description=Local Development Server
